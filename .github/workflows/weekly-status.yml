# Weekly status harvest. Writes program/weekly/YYYY-MM-DD.md from merged PRs
# in sanlee-ys/{kb-agent,notes-api,defense-news-classifier,architecture}.
#
# Prefer a pull request. The default GITHUB_TOKEN can push a branch and open
# a PR only when:
#   1. This workflow has contents: write and pull-requests: write (below).
#   2. The repo setting "Allow GitHub Actions to create and approve pull
#      requests" is on (Settings → Actions → General → Workflow permissions).
# If the token cannot push the branch, or cannot open the PR, the job opens
# a GitHub Issue with the same markdown body. issues: write is that fallback.
#
# The harvest does not invent progress. An empty week still commits a file
# that says zero merged PRs.
name: Weekly status

on:
  schedule:
    - cron: "0 12 * * 1"  # Monday 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Harvest merged PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/weekly_status.py --date "$(date -u +%F)"

      - name: Open a PR, or an issue if push fails
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          DATE=$(date -u +%F)
          FILE="program/weekly/${DATE}.md"
          BRANCH="weekly-status-${DATE}"
          TITLE="docs(program): weekly status ${DATE}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$FILE"

          if git diff --cached --quiet; then
            echo "No change in $FILE. The harvest already matches HEAD."
            exit 0
          fi

          git checkout -B "$BRANCH"
          git commit -m "$TITLE"

          open_issue() {
            echo "Push or PR create failed. Open an issue with the same body."
            gh issue create --title "Weekly status ${DATE} (PR fallback)" --body-file "$FILE"
          }

          if git push --force-with-lease origin "$BRANCH"; then
            if gh pr create --title "$TITLE" --body-file "$FILE" --base main --head "$BRANCH"; then
              exit 0
            fi
          fi
          open_issue
