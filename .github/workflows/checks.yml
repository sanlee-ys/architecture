name: Checks

on:
  push:
  pull_request:
  # The metrics check now asserts a surface in ANOTHER repo (the GitHub profile README).
  # Nothing about editing that file triggers this workflow, so on push/PR alone the drift
  # would sit undetected until someone happened to commit here - which could be weeks, and
  # the whole point is not to depend on someone happening to do something.
  #
  # SYS-019 rejects a scheduled sweep as a SUBSTITUTE for a build that goes red, and this
  # is not one: local surfaces are still gated per-commit. This is the backstop that ADR
  # explicitly allows for claims a commit hook cannot reach.
  schedule:
    - cron: "0 13 * * 1"  # Mondays 13:00 UTC
  workflow_dispatch:

jobs:
  decision-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Failure-path tests for the two guard scripts. Both steps below run their script
      # against this repo's real content, where it is expected to pass — which exercises
      # the happy path and leaves every drift-detection branch unexecuted. A guard could
      # stop guarding and this job would stay green, which is the exact failure both
      # scripts are written to prevent, one level up.
      #
      # Not hypothetical: PR #78's first draft asserted remote liveness as "did this
      # surface carry ANY marker", and a backticked version marker passed clean because
      # healthy neighbours kept every aggregate count nonzero. It was caught by throwaway
      # scripts. These tests are those scripts, kept.
      #
      # Hermetic by construction — `fetch_artifact` and `fetch_text` are stubbed — so this
      # step is fast and cannot be reddened by GitHub being down.
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test the guard scripts
        # `-p no:cacheprovider`: the decision-log lint in the next step sweeps every
        # first-party text file in the repo, and a `.pytest_cache/` left behind here would
        # be walked as if this repo owned it.
        run: python -m pytest tests/ -q -p no:cacheprovider

      # The drift classes this catches were previously found by a manual audit
      # that cost 35 agents and 2.8M tokens: a doc with no row in the log table,
      # a table status contradicting the document's own header for three weeks,
      # unresolvable cross-links, and an empty Alternatives table on a decision
      # that is supposed to have foreclosed something. All mechanically checkable.
      # This is SYS-018's pattern turned on the decision log itself.
      - name: Lint the decision log
        run: python scripts/lint_decision_log.py

      # Three narrative surfaces here were quoting the classifier's v2 numbers a day
      # after v3.0.0 shipped. The portfolio already guarded its own copies of these
      # figures, but that check reads HTML spans in a different repo, so it had no
      # reach into Markdown prose here. Same failure, same fix, one repo over.
      #
      # Fetches the producer's published artifact, so it warns-and-passes on a network
      # failure rather than reddening an unrelated build.
      #
      # As of 2026-07-26 it also fetches and asserts the GitHub profile README, which was
      # found advertising the classifier at v3.0.0 a day after v3.1.0 shipped. That repo
      # has no workflow of its own by deliberate choice - see REMOTE_SCANNED in the script
      # for why a fifth checker was declined - so a failure here can mean a file in
      # sanlee-ys/sanlee-ys needs the fix, not a file in this repo. The error names the
      # surface.
      - name: Check prose metrics against the classifier artifact
        run: python scripts/check_program_metrics.py
