apiVersion: apps/v1
kind: Deployment
metadata:
  name: classifier
  namespace: local-system
  labels:
    app.kubernetes.io/name: classifier
    app.kubernetes.io/part-of: local-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: classifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: classifier
        app.kubernetes.io/part-of: local-system
    spec:
      containers:
        - name: classifier
          image: classifier:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: classifier
                  key: ANTHROPIC_API_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: classifier
  namespace: local-system
  labels:
    app.kubernetes.io/name: classifier
    app.kubernetes.io/part-of: local-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: classifier
  ports:
    - name: http
      port: 8080
      targetPort: http
